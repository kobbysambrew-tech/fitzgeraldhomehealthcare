<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Fitzgerald Home Health Care</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(35, 211, 215, 0.12), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(142, 25, 232, 0.14), transparent 30%),
        #0b1220;
      color: #eef1f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 190px;
      max-width: 80%;
      margin-bottom: 20px;
    }

    .brand h1 {
      font-family: "Manrope", sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .brand p {
      color: #9ba8b8;
      font-size: 15px;
    }

    .card {
      background: rgba(17, 27, 45, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      backdrop-filter: blur(16px);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #dce4ed;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 12px;
      border: 1px solid #2b3a51;
      background: #0b1220;
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #23d3d7;
      box-shadow: 0 0 0 3px rgba(35, 211, 215, 0.1);
    }

    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #23d3d7, #8e19e8);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
      margin-top: 4px;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      background: rgba(220, 53, 69, 0.12);
      border: 1px solid rgba(220, 53, 69, 0.3);
      color: #ff9ca7;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #8f9bad;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #74f1ef;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #667387;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <!-- Keep your existing logo here if you have it -->
      <h1>Administrator Portal</h1>
      <p>Fitzgerald Home Health Care</p>
    </div>

    <div class="card">

      <div id="errorMessage" class="error"></div>

      <form id="loginForm">

        <div class="field">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="admin@example.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton">
          Sign In
        </button>

      </form>

      <a href="index.html" class="back">← Back to website</a>

    </div>

    <div class="footer">
      Authorized personnel only
    </div>

  </div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // ============================================================
    // PASTE YOUR FIREBASE CONFIG HERE
    // ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyBmF2KsnluQXsu9PVTQcm_n5KX4e3sW57E",
  authDomain: "fitz-6edbe.firebaseapp.com",
  projectId: "fitz-6edbe",
  storageBucket: "fitz-6edbe.firebasestorage.app",
  messagingSenderId: "952213274572",
  appId: "1:952213274572:web:305d7da69ec422a755e769"
};


    // ============================================================
    // FIREBASE INITIALIZATION
    // ============================================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    // ============================================================
    // ELEMENTS
    // ============================================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");


    // ============================================================
    // CHECK EXISTING LOGIN
    // ============================================================

    onAuthStateChanged(auth, (user) => {

      if (user) {
        window.location.href = "admin-dashboard.html";
      }

    });


    // ============================================================
    // LOGIN
    // ============================================================

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      errorMessage.style.display = "none";
      errorMessage.textContent = "";

      loginButton.disabled = true;
      loginButton.textContent = "Signing in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        window.location.href = "admin-dashboard.html";

      } catch (error) {

        console.error("Firebase login error:", error);

        let message = "Unable to sign in. Please check your email and password.";

        if (error.code === "auth/invalid-credential") {
          message = "The email or password is incorrect.";
        }

        if (error.code === "auth/user-not-found") {
          message = "No administrator account was found with that email.";
        }

        if (error.code === "auth/wrong-password") {
          message = "The password is incorrect.";
        }

        if (error.code === "auth/invalid-api-key") {
          message = "Firebase API key is invalid. Check the Firebase configuration.";
        }

        if (error.code === "auth/operation-not-allowed") {
          message = "Email/password authentication is not enabled in Firebase.";
        }

        if (error.code === "auth/network-request-failed") {
          message = "Network error. Please check your internet connection.";
        }

        errorMessage.textContent = message;
        errorMessage.style.display = "block";

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";

      }

    });

  </script>

</body>
</html>
